    - generic [ref=f9e65]:
      - generic [ref=f9e66]:
        - heading "Как создать и настроить каталог товаров" [level=1] [ref=f9e67]
        - generic [ref=f9e69]:
          - img "Анна Молитвик" [ref=f9e71]
          - generic [ref=f9e72]:
            - generic [ref=f9e73]: "Автор: Анна Молитвик"
            - generic [ref=f9e74]: "Последнее обновление: 23 июля 2026 г."
        - generic [ref=f9e75]:
          - paragraph [ref=f9e76]: В Битрикс24 единый каталог товаров для CRM и интернет-магазинов. Когда вы создаете страницу в интернет-магазине, ее можно быстро наполнить товарами из каталога. Когда вы работаете с клиентами в CRM, можно добавлять товары в счет или торговое предложение.
          - paragraph [ref=f9e77]: "Откройте каталог товаров в любом из разделов:"
          - list [ref=f9e78]:
            - listitem [ref=f9e79]: CRM > Товары и Склады > Каталог товаров
            - listitem [ref=f9e80]: Сайты и магазины > Товары и Склады > Каталог товаров
          - paragraph [ref=f9e81]:
            - text: Перед тем как добавить товары в каталог, нужно создать разделы и добавить пользовательские
            - generic [ref=f9e82]: свойства товаров.
          - heading "Как создать разделы товаров" [level=2] [ref=f9e83]
          - list [ref=f9e84]:
            - listitem [ref=f9e85]: Нажмите на значок рядом с кнопкой Создать.
            - listitem [ref=f9e86]: Выберите Раздел.
            - listitem [ref=f9e87]: Заполните название и описание.
            - listitem [ref=f9e88]: Сохраните изменения.
          - link [ref=f9e90] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/36.jpg
            - img "Скрин.jpg" [ref=f9e91]
          - link [ref=f9e94] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/37.jpg
            - img "Скрин.jpg" [ref=f9e95]
          - paragraph [ref=f9e97]: В разделах можно создавать подразделы. Чтобы привязать подраздел к основному, в поле Родительский раздел укажите его название. Заполните поля и сохраните.
          - link [ref=f9e99] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/38.jpg
            - img "Скрин.jpg" [ref=f9e100]
          - heading "Как добавить свойства товаров" [level=2] [ref=f9e102]
          - paragraph [ref=f9e103]: "В Битрикс24 есть набор стандартных свойств: наименование товара, бренд, единица измерения. Чтобы создать пользовательские свойства, откройте Сайты и Магазины > Товары и Склады > Настройки > Товарный каталог > Свойства товаров. Нажмите Создать."
          - link [ref=f9e105] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/39.jpg
            - img "Скрин.jpg" [ref=f9e106]
          - link [ref=f9e109] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/40.jpg
            - img "Скрин.jpg" [ref=f9e110]
          - paragraph [ref=f9e112]: "Чтобы добавить свойство, заполните поля во вкладке Общее:"
          - list [ref=f9e113]:
            - listitem [ref=f9e114]: "Тип — определяет какие данные могут хранится в поле: список, число, файл и другие."
            - listitem [ref=f9e115]: Символьный код — может содержать только латинские символы, цифры и знаки подчеркивания.
            - listitem [ref=f9e116]: Название — название поля.
            - listitem [ref=f9e117]: Сортировка — влияет на расположение свойства в интернет-магазине.
            - listitem [ref=f9e118]: Активность — поставьте галочку, если хотите выводить поле в карточке товара.
            - listitem [ref=f9e119]: Множественное — можно выбрать несколько значений одновременно.
            - listitem [ref=f9e120]: Обязательное — обязательно для заполнения.
            - listitem [ref=f9e121]: Значения участвуют в поиске — это значит, что поиск по значению из поля будет в каталоге товаров и в интернет-магазине.
            - listitem [ref=f9e122]: Показывать в интернет-магазине — эта настройка выводит поле в интернет-магазине, в карточках товаров, в каталоге.
          - link [ref=f9e124] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/41.jpg
            - img "Скрин.jpg" [ref=f9e125]
          - paragraph [ref=f9e127]: "Дополнительно:"
          - list [ref=f9e128]:
            - listitem [ref=f9e129]: Показывать в фильтре каталога товаров — поле будет выведено внутри системного фильтра в интернет-магазине.
            - listitem [ref=f9e130]: "Вид в умном фильтре — выберите вид отображения значений в поле: флажки, радиокнопки, выпадающий список."
            - listitem [ref=f9e131]: Показать развернутым — значения поля можно сразу показывать клиентам в развернутом виде.
            - listitem [ref=f9e132]: Подсказка в умном фильтре для посетителей — выводится в интернет-магазине в виде вопроса рядом с полей.
          - paragraph [ref=f9e133]: Сохраните изменения. Теперь поле доступно для заполнения в карточке товара.
          - link [ref=f9e135] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/42.jpg
            - img "Скрин.jpg" [ref=f9e136]
          - paragraph [ref=f9e138]:
            - text: Добавить свойства товаров можно и в CRM. Подробно об этом, рассказали в отдельной статье.
            - link "Как добавить свойства товаров в CRM" [ref=f9e139] [cursor=pointer]:
              - /url: https://helpdesk.bitrix24.ru/open/5488473/
          - heading "Как создать товар" [level=2] [ref=f9e140]
          - paragraph [ref=f9e141]: Откройте в каталоге товаров нужный раздел и нажмите Создать.
          - link [ref=f9e143] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/43.jpg
            - img "Скрин.jpg" [ref=f9e144]
          - paragraph [ref=f9e146]:
            - text: Заполните необходимые поля, укажите характеристики, цену и закрепите товар за разделом.
            - link "Как создать новый товар в каталоге" [ref=f9e147] [cursor=pointer]:
              - /url: https://helpdesk.bitrix24.ru/open/11657084/
          - paragraph [ref=f9e148]:
            - text: В карточке можно добавить несколько вариаций товара. Вариации — это дополнительные характеристики одного товара. Например, разные размеры или цвета одной и той же футболки. Для таких товаров вы можете создать вариации, которые будут учитывать их свойства и отличия в каталоге.
            - link "Работа с вариациями товара" [ref=f9e149] [cursor=pointer]:
              - /url: https://helpdesk.bitrix24.ru/open/11657102/
          - link [ref=f9e151] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/44.jpg
            - img "Скрин.jpg" [ref=f9e152]
          - paragraph [ref=f9e154]:
            - text: Если у вас есть список товаров в формате csv, его можно импортировать в Битрикс24.
            - link "Как импортировать товары в CRM" [ref=f9e155] [cursor=pointer]:
              - /url: https://helpdesk.bitrix24.ru/open/13210236
            - link "Право на запусĸ импорта и эĸспорта товаров" [ref=f9e156] [cursor=pointer]:
              - /url: https://helpdesk.bitrix24.ru/open/16342582/?sphrase_id=138345348
          - heading "Как настроить каталог товаров" [level=2] [ref=f9e157]
          - paragraph [ref=f9e158]: Нажмите Настройки (⚙️) и выберите, какие поля хотите вывести в каталоге товаров. Опция Для всех включает остальным сотрудникам такой же список, который вы настроили себе. Нажмите Применить > Подтвердить.
          - link [ref=f9e160] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/45.jpg
            - img "Скрин.jpg" [ref=f9e161]
          - paragraph [ref=f9e163]: В режиме просмотра Список можно быстро изменить несколько параметров, не открывая карточку. Выберите товары и нажмите Редактировать. Впишите новые данные и сохраните изменения. Если у товара есть вариация, вы можете выбрать ее и работать с параметрами из списка.
          - link [ref=f9e165] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/46.jpg
            - img "Скрин.jpg" [ref=f9e166]
          - link [ref=f9e169] [cursor=pointer]:
            - /url: /images/helpdesk/screenshots/ru/am/screen/47.jpg
            - img "Скрин.jpg" [ref=f9e170]
