        - paragraph [ref=f7e598]:
          - text: В карточке можно добавить несколько вариаций товара. Вариации — это дополнительные характеристики одного товара. Например, разные размеры или цвета одной и той же футболки. Для таких товаров вы можете создать вариации, которые будут учитывать их свойства и отличия в каталоге.
          - link "Работа с вариациями товара" [ref=f7e599] [cursor=pointer]:
