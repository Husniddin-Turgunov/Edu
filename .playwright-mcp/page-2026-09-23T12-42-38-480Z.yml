    - generic [ref=f7e518]:
      - generic [ref=f7e519]:
        - generic [ref=f7e520]: Как создать и настроить каталог товаров
        - link "Открыть в новой вкладке" [ref=f7e522] [cursor=pointer]:
          - /url: /open/20922462?SOURCE_LINK_PLACE=ARTICLE_DETAIL
      - generic [ref=f7e524]:
        - generic "Анна Молитвик" [ref=f7e528]
        - generic [ref=f7e529]:
          - generic [ref=f7e530]: "Автор: Анна Молитвик"
          - generic [ref=f7e531]: "Последнее обновление: 23 июля 2026 г."
      - generic [ref=f7e533]:
        - paragraph [ref=f7e534]: В Битрикс24 единый каталог товаров для CRM и интернет-магазинов. Когда вы создаете страницу в интернет-магазине, ее можно быстро наполнить товарами из каталога. Когда вы работаете с клиентами в CRM, можно добавлять товары в счет или торговое предложение.
        - paragraph [ref=f7e535]: "Откройте каталог товаров в любом из разделов:"
        - list [ref=f7e536]:
          - listitem [ref=f7e537]: CRM > Товары и Склады > Каталог товаров
          - listitem [ref=f7e538]: Сайты и магазины > Товары и Склады > Каталог товаров
        - paragraph [ref=f7e539]:
          - text: Перед тем как добавить товары в каталог, нужно создать разделы и добавить пользовательские
          - generic [ref=f7e540]: свойства товаров.
        - heading "Как создать разделы товаров" [level=2] [ref=f7e541]
        - list [ref=f7e542]:
          - listitem [ref=f7e543]: Нажмите на значок рядом с кнопкой Создать.
          - listitem [ref=f7e544]: Выберите Раздел.
          - listitem [ref=f7e545]: Заполните название и описание.
          - listitem [ref=f7e546]: Сохраните изменения.
        - link [ref=f7e548] [cursor=pointer]:
          - /url: /images/helpdesk/screenshots/ru/am/screen/36.jpg
          - img "Скрин.jpg" [ref=f7e549]
        - link [ref=f7e551] [cursor=pointer]:
          - /url: /images/helpdesk/screenshots/ru/am/screen/37.jpg
          - img "Скрин.jpg" [ref=f7e552]
        - paragraph [ref=f7e553]: В разделах можно создавать подразделы. Чтобы привязать подраздел к основному, в поле Родительский раздел укажите его название. Заполните поля и сохраните.
        - link [ref=f7e555] [cursor=pointer]:
          - /url: /images/helpdesk/screenshots/ru/am/screen/38.jpg
          - img "Скрин.jpg" [ref=f7e556]
        - heading "Как добавить свойства товаров" [level=2] [ref=f7e557]
        - paragraph [ref=f7e558]: "В Битрикс24 есть набор стандартных свойств: наименование товара, бренд, единица измерения. Чтобы создать пользовательские свойства, откройте Сайты и Магазины > Товары и Склады > Настройки > Товарный каталог > Свойства товаров. Нажмите Создать."
        - link [ref=f7e560] [cursor=pointer]:
          - /url: /images/helpdesk/screenshots/ru/am/screen/39.jpg
          - img "Скрин.jpg" [ref=f7e561]
        - link [ref=f7e563] [cursor=pointer]:
          - /url: /images/helpdesk/screenshots/ru/am/screen/40.jpg
          - img "Скрин.jpg" [ref=f7e564]
        - paragraph [ref=f7e565]: "Чтобы добавить свойство, заполните поля во вкладке Общее:"
        - list [ref=f7e566]:
          - listitem [ref=f7e567]: "Тип — определяет какие данные могут хранится в поле: список, число, файл и другие."
          - listitem [ref=f7e568]: Символьный код — может содержать только латинские символы, цифры и знаки подчеркивания.
          - listitem [ref=f7e569]: Название — название поля.
          - listitem [ref=f7e570]: Сортировка — влияет на расположение свойства в интернет-магазине.
          - listitem [ref=f7e571]: Активность — поставьте галочку, если хотите выводить поле в карточке товара.
          - listitem [ref=f7e572]: Множественное — можно выбрать несколько значений одновременно.
          - listitem [ref=f7e573]: Обязательное — обязательно для заполнения.
          - listitem [ref=f7e574]: Значения участвуют в поиске — это значит, что поиск по значению из поля будет в каталоге товаров и в интернет-магазине.
          - listitem [ref=f7e575]: Показывать в интернет-магазине — эта настройка выводит поле в интернет-магазине, в карточках товаров, в каталоге.
        - link [ref=f7e577] [cursor=pointer]:
          - /url: /images/helpdesk/screenshots/ru/am/screen/41.jpg
          - img "Скрин.jpg" [ref=f7e578]
        - paragraph [ref=f7e579]: "Дополнительно:"
        - list [ref=f7e580]:
          - listitem [ref=f7e581]: Показывать в фильтре каталога товаров — поле будет выведено внутри системного фильтра в интернет-магазине.
          - listitem [ref=f7e582]: "Вид в умном фильтре — выберите вид отображения значений в поле: флажки, радиокнопки, выпадающий список."
          - listitem [ref=f7e583]: Показать развернутым — значения поля можно сразу показывать клиентам в развернутом виде.
          - listitem [ref=f7e584]: Подсказка в умном фильтре для посетителей — выводится в интернет-магазине в виде вопроса рядом с полей.
        - paragraph [ref=f7e585]: Сохраните изменения. Теперь поле доступно для заполнения в карточке товара.
        - link [ref=f7e587] [cursor=pointer]:
          - /url: /images/helpdesk/screenshots/ru/am/screen/42.jpg
          - img "Скрин.jpg" [ref=f7e588]
        - paragraph [ref=f7e589]:
          - text: Добавить свойства товаров можно и в CRM. Подробно об этом, рассказали в отдельной статье.
          - link "Как добавить свойства товаров в CRM" [ref=f7e590] [cursor=pointer]:
            - /url: https://helpdesk.bitrix24.ru/open/5488473/
        - heading "Как создать товар" [level=2] [ref=f7e591]
        - paragraph [ref=f7e592]: Откройте в каталоге товаров нужный раздел и нажмите Создать.
        - link [ref=f7e594] [cursor=pointer]:
          - /url: /images/helpdesk/screenshots/ru/am/screen/43.jpg
          - img "Скрин.jpg" [ref=f7e595]
        - paragraph [ref=f7e596]:
          - text: Заполните необходимые поля, укажите характеристики, цену и закрепите товар за разделом.
